    MQTT_TOPIC_PUB: building/elevator
  broker: broker_3
- name: pm_gw
  template: predictive_maintenance
  ip: 10.0.0.12
  switch: s3
  dcmd: null
  log: /tmp/pm_gw.log
  env:
    MQTT_TOPIC_PUB: industrial/predictive_maintenance
    SLEEP_TIME_SD: '1'
  broker: broker_3
- name: te_gw
