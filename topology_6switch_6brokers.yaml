# IoT-Zoo scenario: 6 switches + 6 MQTT brokers.
#
# Purpose:
#   Stress-test the configuration-driven topology support with multiple
#   L2 switches, one MQTT broker per switch, explicit broker assignment
#   for MQTT profiles, link impairment, and multiple capture points.
#
# Notes:
#   - This file uses only existing templates from catalog.yaml.
#   - No catalog.yaml change is required unless you add new device types/images.
#   - Because capture.points has three switches, an output such as
#     ./iot_zoo_6sw_test.pcap will produce:
#       ./iot_zoo_6sw_test_s1.pcap
#       ./iot_zoo_6sw_test_s4.pcap
#       ./iot_zoo_6sw_test_s6.pcap
#
experiment:
  time: 600
  output: capture_6switch_6brokers.pcap
network:
  subnet: 10.0.0.0/24
  nat:
    name: nat0
    ip: 10.0.0.254
    switch: s1
dataset_dir: devices/urban_observatory
catalog: catalog.yaml
switches:
- name: s1
- name: s2
- name: s3
- name: s4
- name: s5
- name: s6
links:
- a: s1
  b: s2
  bw: 100
  delay: 2ms
- a: s1
  b: s3
  bw: 100
  delay: 2ms
- a: s2
  b: s4
  bw: 50
  delay: 10ms
  loss: 0.2
- a: s2
  b: s5
  bw: 20
  delay: 20ms
  loss: 0.5
- a: s3
  b: s6
  bw: 5
  delay: 40ms
  loss: 1.0
capture:
  points:
  - s1
  - s4
  - s6
  bpf: not port 6653
services:
- name: broker_1
  kind: mqtt_broker
  ip: 10.0.0.100
  switch: s1
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: broker_2
  kind: mqtt_broker
  ip: 10.0.0.101
  switch: s2
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: broker_3
  kind: mqtt_broker
  ip: 10.0.0.102
  switch: s3
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: broker_4
  kind: mqtt_broker
  ip: 10.0.0.103
  switch: s4
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: broker_5
  kind: mqtt_broker
  ip: 10.0.0.104
  switch: s5
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: broker_6
  kind: mqtt_broker
  ip: 10.0.0.105
  switch: s6
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: v_srv
  kind: rtsp_server
  ip: 10.0.0.20
  switch: s6
  image: myzoo/server_video
  privileged: true
  dcmd: /bin/bash
  link_up: true
  boot:
  - /mediamtx /mediamtx.yml > /tmp/v_srv.log 2>&1 &
  boot_delay: 3
profiles:
- name: predio
  template: building_monitor
  ip: 10.0.0.2
  switch: s2
  env:
    MQTT_TOPIC_PUB: building
  broker: broker_2
- name: cooler
  template: cooler_motor
  ip: 10.0.0.3
  switch: s3
  broker: broker_3
- name: domotic
  template: domotic_monitor
  ip: 10.0.0.4
  switch: s2
  broker: broker_2
- name: predictive
  template: predictive_maintenance
  ip: 10.0.0.5
  switch: s3
  broker: broker_3
- name: air
  template: air_quality
  ip: 10.0.0.6
  switch: s3
  broker: broker_3
- name: patient1
  template: mhealth
  ip: 10.0.0.7
  switch: s2
  env:
    MQTT_TOPIC_PUB: hospital/patients
    SUBJECT_ID: '1'
    SPEED_FACTOR: '0.02'
  broker: broker_2
- name: sl_gw
  template: smart_lighting
  ip: 10.0.0.8
  switch: s2
  env:
    MQTT_TOPIC_PUB: city/lighting
  broker: broker_2
- name: es_gw
