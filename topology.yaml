# IoT-Zoo base topology: reproduces the original single-switch (star) MQTT testbed.
# 43 device profiles + 3 infra (broker, rtsp server, NAT) = 46 containers.
experiment:
  time: 600
  output: capture.pcap
network:
  subnet: 10.0.0.0/24
  nat:
    name: nat0
    ip: 10.0.0.254
    switch: s1
dataset_dir: devices/urban_observatory
catalog: catalog.yaml
switches:
- name: s1
links: []
capture:
  points:
  - s1
  bpf: not port 6653
services:
- name: broker
  kind: mqtt_broker
  ip: 10.0.0.100
  ip_pool: 10.0.0.101-10.0.0.110
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
- name: v_srv
  kind: rtsp_server
  ip: 10.0.0.20
  image: myzoo/server_video
  privileged: true
  dcmd: /bin/bash
  link_up: true
  boot:
  - /mediamtx /mediamtx.yml > /tmp/v_srv.log 2>&1 &
  boot_delay: 3
profiles:
- name: predio
  template: building_monitor
  ip: 10.0.0.2
  switch: s1
  env:
    MQTT_TOPIC_PUB: building
- name: cooler
  template: cooler_motor
  ip: 10.0.0.3
  switch: s1
- name: domotic
  template: domotic_monitor
  ip: 10.0.0.4
  switch: s1
- name: predictive
  template: predictive_maintenance
  ip: 10.0.0.5
  switch: s1
- name: air
  template: air_quality
  ip: 10.0.0.6
  switch: s1
- name: patient1
  template: mhealth
  ip: 10.0.0.7
  switch: s1
  env:
    MQTT_TOPIC_PUB: hospital/patients
    SUBJECT_ID: '1'
    SPEED_FACTOR: '0.02'
- name: sl_gw
  template: smart_lighting
  ip: 10.0.0.8
  switch: s1
  env:
    MQTT_TOPIC_PUB: city/lighting
- name: es_gw
  template: environmental_sensors
  ip: 10.0.0.9
  switch: s1
  env:
    MQTT_TOPIC_PUB: school/environmental_sensors
- name: aq_gw
  template: aquaponics_fish_pond
  ip: 10.0.0.10
  switch: s1
  env:
    MQTT_TOPIC_PUB: aquaponics/fish_pond
- name: el_gw
  template: elevator_predictive_maintenance
  ip: 10.0.0.11
  switch: s1
  env:
    MQTT_TOPIC_PUB: building/elevator
- name: pm_gw
  template: predictive_maintenance
  ip: 10.0.0.12
  switch: s1
  dcmd: null
  log: /tmp/pm_gw.log
  env:
    MQTT_TOPIC_PUB: industrial/predictive_maintenance
    SLEEP_TIME_SD: '1'
- name: te_gw
  template: traction_elevator
  ip: 10.0.0.13
  switch: s1
  env:
    MQTT_TOPIC_PUB: elevator/traction/predictive_maintenance
- name: gr_gw
  template: greenhouse_sensor
  ip: 10.0.0.14
  switch: s1
  env:
    MQTT_TOPIC_PUB: greenhouse/env
- name: far_gw
  template: farming_sensor
  ip: 10.0.0.15
  switch: s1
  env:
    MQTT_TOPIC_PUB: farming_sensor/env
- name: sb_gw
  template: smart_building_m5
  ip: 10.0.0.16
  switch: s1
  env:
    MQTT_TOPIC_PUB: building/m5
- name: ns_gw
  template: nurse_stress
  ip: 10.0.0.17
  switch: s1
  env:
    MQTT_TOPIC_PUB: hospital/nurse_stress
- name: gw_co
  template: urban_sensor
  ip: 10.0.0.50
  switch: s1
  env:
    TARGET_VARIABLE: CO
    MQTT_TOPIC_PUB: city/air/co
- name: gw_no2
