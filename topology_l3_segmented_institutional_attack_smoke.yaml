metadata:
  version: v12_attack_smoke_optional
  based_on: v11_stable_broker_routes
  description: Optional smoke-test topology enabling attacker_node/scanner_node safe boundary traffic. Use only after validating
    the benign v12 topology.
  external_benign_clients:
    benign_dashboard: Long-lived subscriber for all field-domain topics plus periodic status/summary requests.
    mobile_app_user: Intermittent/polling subscriber for selected hospital, school and outdoor topics plus heartbeat/latest
      requests.
    external_client: Generic wildcard polling client plus periodic poll publications.
  malicious_nodes:
    main_topology: attacker_node and scanner_node remain idle placeholders.
    optional_topology: topology_l3_segmented_institutional_attack_smoke.yaml enables safe non-exploitative smoke traffic for
      boundary/capture testing.
