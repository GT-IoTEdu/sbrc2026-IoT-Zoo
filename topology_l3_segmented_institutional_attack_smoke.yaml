    STREAM_NAME: cam1
  start: bash -lc 'ip route replace default via 10.30.5.1 2>/dev/null || true; ip route replace 10.20.0.0/24 via 10.30.5.1
    2>/dev/null || true; until ping -c1 -W1 10.20.0.20 >/dev/null 2>&1; do echo waiting_rtsp_server; sleep 2; done; sleep
    3; while true; do ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /video.mp4 -c copy -f rtsp -rtsp_transport
    tcp rtsp://10.20.0.20:8554/cam1; echo publisher_exit_$?; sleep 3; done'
