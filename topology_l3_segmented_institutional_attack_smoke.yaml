mode: l3
experiment:
  time: 600
  output: capture_iotzoo_l3_segmented.pcap
dataset_dir: devices/urban_observatory
catalog: catalog.yaml
switches:
- name: sw_external
- name: sw_infra
- name: sw_hospital
- name: sw_university
- name: sw_industrial
- name: sw_school
- name: sw_cctv
- name: sw_outdoor
networks:
- name: external
  description: External / threat / human-user segment
  subnet: 10.10.0.0/24
  switch: sw_external
  gateway: 10.10.0.1
  link:
    bw: 1000
    delay: 5ms
    jitter: 1ms
    loss: 0
- name: infra
  description: Cloud / infrastructure / services segment
  subnet: 10.20.0.0/24
  switch: sw_infra
  gateway: 10.20.0.1
  routes:
  - to: 10.30.0.0/16
    via: 10.20.0.254
  link:
    bw: 1000
    delay: 2ms
    jitter: 0.5ms
    loss: 0
- name: hospital
  description: Hospital / health IoT domain
  subnet: 10.30.1.0/24
  switch: sw_hospital
  gateway: 10.30.1.1
  link:
    bw: 1000
    delay: 1ms
    jitter: 0.2ms
    loss: 0
- name: university
  description: University / campus IoT domain
  subnet: 10.30.2.0/24
  switch: sw_university
  gateway: 10.30.2.1
  link:
    bw: 1000
    delay: 1ms
    jitter: 0.2ms
    loss: 0
- name: industrial
  description: Industrial / facilities IoT domain
  subnet: 10.30.3.0/24
  switch: sw_industrial
  gateway: 10.30.3.1
  link:
    bw: 1000
    delay: 1ms
    jitter: 0.2ms
    loss: 0
- name: school
  description: School IoT domain
  subnet: 10.30.4.0/24
  switch: sw_school
  gateway: 10.30.4.1
  link:
    bw: 1000
    delay: 1ms
    jitter: 0.2ms
    loss: 0
- name: cctv
  description: Security / CCTV / media domain
  subnet: 10.30.5.0/24
  switch: sw_cctv
  gateway: 10.30.5.1
  link:
    bw: 1000
    delay: 1ms
    jitter: 0.2ms
    loss: 0
- name: outdoor
  description: Outdoor / smart-city / agriculture domain
  subnet: 10.30.6.0/24
  switch: sw_outdoor
  gateway: 10.30.6.1
  link:
    bw: 100
    delay: 10ms
    jitter: 2ms
    loss: 0.1
routers:
- name: r_edge
  firewall:
    preset: edge_restricted
    allow: []
  interfaces:
  - network: external
    ip: 10.10.0.1
    ifname: r_edge-ext
  - network: infra
    ip: 10.20.0.1
    ifname: r_edge-infra
  routes:
  - to: 10.30.0.0/16
    via: 10.20.0.254
- name: r_field
  firewall:
    preset: field_microsegmentation
    allow: []
  interfaces:
  - network: infra
    ip: 10.20.0.254
    ifname: r_field-infra
  - network: hospital
    ip: 10.30.1.1
    ifname: r_field-hosp
  - network: university
    ip: 10.30.2.1
    ifname: r_field-univ
  - network: industrial
    ip: 10.30.3.1
    ifname: r_field-ind
  - network: school
    ip: 10.30.4.1
    ifname: r_field-school
  - network: cctv
    ip: 10.30.5.1
    ifname: r_field-cctv
  - network: outdoor
    ip: 10.30.6.1
    ifname: r_field-out
  routes:
  - to: default
    via: 10.20.0.1
capture:
  points:
  - sw_infra
  - sw_hospital
  - sw_university
  - sw_industrial
  - sw_school
  - sw_cctv
  - sw_outdoor
  - r_edge:external
  - r_edge:infra
  - r_field:infra
  - r_field:hospital
  - r_field:university
  - r_field:industrial
  - r_field:school
  - r_field:cctv
  - r_field:outdoor
  bpf: not port 6653
services:
- name: attacker_node
  kind: external_attacker
  ip: 10.10.0.10
  network: external
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  notes: OPTIONAL SAFE SMOKE enabled in this topology. Generates non-exploitative reachability/connection-attempt traffic
    only for boundary and capture validation; not a real attack workload.
  start: bash -lc 'TARGETS="10.20.0.100:1883 10.20.0.20:8554"; i=0; while true; do for t in $TARGETS; do host=${t%:*}; port=${t#*:};
    echo "[attacker_smoke] tcp_connect_attempt seq=$i target=$host port=$port"; timeout 2 bash -c "cat < /dev/tcp/${host}/${port}"
    >/dev/null 2>&1 || true; sleep 1; done; i=$((i+1)); sleep 8; done'
  log: /tmp/attacker_node.log
- name: scanner_node
  kind: external_scanner
  ip: 10.10.0.20
  network: external
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  notes: OPTIONAL SAFE SMOKE enabled in this topology. Generates non-exploitative reachability/connection-attempt traffic
    only for boundary and capture validation; not a real attack workload.
  start: bash -lc 'HOSTS="10.20.0.1 10.20.0.20 10.20.0.100 10.20.0.200 10.20.0.210"; i=0; while true; do for h in $HOSTS;
    do echo "[scanner_smoke] probe seq=$i target=$h"; ping -c1 -W1 $h >/dev/null 2>&1 || true; timeout 2 bash -c "cat < /dev/tcp/${h}/1883"
    >/dev/null 2>&1 || true; timeout 2 bash -c "cat < /dev/tcp/${h}/8554" >/dev/null 2>&1 || true; sleep 1; done; i=$((i+1));
    sleep 10; done'
  log: /tmp/scanner_node.log
- name: benign_dashboard
  kind: external_benign_client
  ip: 10.10.0.30
  network: external
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  start: bash -lc 'BROKER=10.20.0.100; PORT=1883; echo "[dashboard] waiting for broker_core ${BROKER}:${PORT}"; until mosquitto_pub
    -h "$BROKER" -p "$PORT" -t human/dashboard/lifecycle -m "boot" >/dev/null 2>&1; do echo "[dashboard] broker not ready";
    sleep 2; done; echo "[dashboard] broker ready"; (while true; do mosquitto_sub -h "$BROKER" -p "$PORT" -t "hospital/#"
    -t "university/#" -t "industrial/#" -t "school/#" -t "outdoor/#" -t "cctv/#" -v; echo "[dashboard] subscriber_exit_$?";
    sleep 2; done) & i=0; while true; do mosquitto_pub -h "$BROKER" -p "$PORT" -t human/dashboard/status -m "online:${i}:$(date
    +%s)" || true; mosquitto_pub -h "$BROKER" -p "$PORT" -t human/dashboard/request/summary -m "refresh:${i}:$(date +%s)"
    || true; i=$((i+1)); sleep 10; done'
  log: /tmp/benign_dashboard.log
  notes: Benign external client. Emulates user/application access by subscribing to aggregated MQTT topics and publishing
    benign status/request traffic to broker_core.
- name: mobile_app_user
  kind: external_benign_client
  ip: 10.10.0.40
  network: external
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  start: bash -lc 'BROKER=10.20.0.100; PORT=1883; echo "[mobile_app] waiting for broker_core ${BROKER}:${PORT}"; until mosquitto_pub
    -h "$BROKER" -p "$PORT" -t human/mobile_app/lifecycle -m "boot" >/dev/null 2>&1; do echo "[mobile_app] broker not ready";
    sleep 2; done; echo "[mobile_app] broker ready"; i=0; while true; do timeout 25 mosquitto_sub -h "$BROKER" -p "$PORT"
    -t "hospital/mhealth/#" -t "school/air_quality" -t "outdoor/weather/#" -v -C 12 || true; mosquitto_pub -h "$BROKER" -p
    "$PORT" -t human/mobile_app/heartbeat -m "alive:${i}:$(date +%s)" || true; mosquitto_pub -h "$BROKER" -p "$PORT" -t human/mobile_app/request/latest
    -m "domains=hospital,school,outdoor seq=${i}" || true; i=$((i+1)); sleep 6; done'
  log: /tmp/mobile_app_user.log
  notes: Benign external client. Emulates user/application access by subscribing to aggregated MQTT topics and publishing
    benign status/request traffic to broker_core.
- name: external_client
  kind: external_benign_client
  ip: 10.10.0.50
  network: external
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  start: bash -lc 'BROKER=10.20.0.100; PORT=1883; echo "[external_client] waiting for broker_core ${BROKER}:${PORT}"; until
    mosquitto_pub -h "$BROKER" -p "$PORT" -t human/external_client/lifecycle -m "boot" >/dev/null 2>&1; do echo "[external_client]
    broker not ready"; sleep 2; done; echo "[external_client] broker ready"; i=0; while true; do timeout 30 mosquitto_sub
    -h "$BROKER" -p "$PORT" -t "#" -v -C 20 || true; mosquitto_pub -h "$BROKER" -p "$PORT" -t human/external_client/poll -m
    "poll:${i}:$(date +%s)" || true; i=$((i+1)); sleep 5; done'
  log: /tmp/external_client.log
  notes: Benign external client. Emulates user/application access by subscribing to aggregated MQTT topics and publishing
    benign status/request traffic to broker_core.
- name: broker_core
  kind: mqtt_broker
  ip: 10.20.0.100
  network: infra
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf -d &
  boot_delay: 1
  notes: Core MQTT broker in the infrastructure segment. Receives bridged telemetry from local brokers and benign external
    user/application traffic.
  link_up: true
- name: rtsp_server
  kind: rtsp_server
  ip: 10.20.0.20
  network: infra
  image: myzoo/server_video
  privileged: true
  dcmd: /bin/bash
  link_up: true
  boot:
  - pkill -x mediamtx 2>/dev/null || true; /mediamtx > /tmp/rtsp_server.log 2>&1 &
  boot_delay: 8
- name: ids_collector
  kind: ids_collector
  ip: 10.20.0.200
  network: infra
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
- name: log_mgmt
  kind: log_management
  ip: 10.20.0.210
  network: infra
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
- name: broker_hospital
  kind: mqtt_broker
  ip: 10.30.1.100
  network: hospital
  image: myzoo/mqtt_broker
  dcmd: /bin/bash
  boot:
  - 'printf ''%s\n'' ''persistence true'' ''persistence_location /mosquitto/data/'' ''log_dest file /mosquitto/log/mosquitto.log''
    ''listener 1883'' ''allow_anonymous true'' ''connection bridge_to_core'' ''clientid bridge_broker_hospital'' ''address
    10.20.0.100:1883'' ''try_private false'' ''start_type automatic'' ''topic # out 0'' > /tmp/mosquitto_bridge.conf; /usr/sbin/mosquitto
    -c /tmp/mosquitto_bridge.conf -d'
  boot_delay: 1
  notes: 'Local MQTT broker with one-way bridge to broker_core using topic # out 0. This preserves stable domain-local telemetry
    while exposing aggregated traffic at the infrastructure segment.'
  link_up: true
