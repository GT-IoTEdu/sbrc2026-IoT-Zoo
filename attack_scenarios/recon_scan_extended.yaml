scenario:
  name: external_recon_scan_extended
  description: External reconnaissance with ICMP sweep, TCP scan, and UDP scan.
  default_network: external
  ip_start: 10.10.0.60

attacks:
  - name: atk_ping_sweep_infra
    type: ping_sweep
    enabled: true
    target_net: 10.20.0.0/24
    start_s: 20
    duration_s: 15
    params:
      timeout_ms: 100
      retries: 1

  - name: atk_tcp_scan_infra_services
    type: port_scanner_tcp
    enabled: true
    targets: [broker_core, rtsp_server, ids_collector, log_mgmt]
    start_s: 30
    duration_s: 30
    params:
      ports: [1883, 8554, 80, 443]
      timing: T3
      max_retries: 1
      host_timeout: 20s

  - name: atk_udp_scan_infra_services
    type: port_scanner_udp
    enabled: true
    targets: [broker_core, rtsp_server, ids_collector, log_mgmt]
    start_s: 65
    duration_s: 30
    params:
      ports: [53, 123, 161, 5683]
      timing: T3
      max_retries: 1
      host_timeout: 20s
