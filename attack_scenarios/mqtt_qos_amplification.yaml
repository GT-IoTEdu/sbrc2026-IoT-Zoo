scenario:
  name: mqtt_qos_amplification_external
  description: Controlled MQTT QoS 2 amplification against broker_core.
  default_network: external
  ip_start: 10.10.0.60

attacks:
  - name: atk_mqtt_qos_amp_core
    type: mqtt_qos_amplification
    enabled: true
    target: broker_core
    target_port: 1883
    start_s: 35
    duration_s: 20
    params:
      threads: 8
      count: 30
      delay_ms: 20
