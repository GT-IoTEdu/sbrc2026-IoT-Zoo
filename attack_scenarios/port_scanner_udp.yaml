scenario:
  name: udp_port_scan_external
  description: External UDP scan of selected infrastructure services.
  default_network: external
  ip_start: 10.10.0.60

attacks:
  - name: atk_udp_scan_infra_services
    type: port_scanner_udp
    enabled: true
    targets: [broker_core, rtsp_server, ids_collector, log_mgmt]
    start_s: 30
    duration_s: 30
    params:
      ports: [53, 123, 161, 5683]
      timing: T3
      max_retries: 1
      host_timeout: 20s
